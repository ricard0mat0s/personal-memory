[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory"
version = "0.1.0"
description = "Private, Git-backed durable memory for supported AI clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]
