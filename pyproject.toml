[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory"
version = "0.1.0"
description = "Private, Git-backed durable memory for supported AI clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "auth0-server-python>=1.0.0b1,<2",
    "flask[async]>=3.1.3",
    "markupsafe>=3.0.3",
    "mcp>=2.0,<3.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]
